[workspace]
resolver = "2"
members = ["crates/lockwatch-core", "crates/lockwatch-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/steve-alex999/lookwatch"
rust-version = "1.97"

# Versions are pinned here once and shared by both crates
# (crates refer to them with `dep.workspace = true`).
[workspace.dependencies]
lockwatch-core = { path = "crates/lockwatch-core" }
anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
futures = "0.3.34"
insta = { version = "1.49.0", features = ["json", "redactions"] }
oxc_allocator = "0.153.0"
oxc_ast = "0.153.0"
oxc_ast_visit = "0.153.0"
oxc_parser = "0.153.0"
oxc_span = "0.153.0"
oxc_syntax = "0.153.0"
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots", "http2", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10.6"
sha2 = "0.10.9"
strsim = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "fs", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
# Smaller, faster binary for the Docker image. `debug = false` is the default.
lto = "thin"
codegen-units = 4
